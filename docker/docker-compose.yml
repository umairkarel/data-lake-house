services:

  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode — no Zookeeper needed)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"       # internal (Docker network)
      - "29092:29092"     # external (host → container, for local tools / msgGeneratorKafka)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Kafka UI — browse topics, produce/consume messages visually
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lakehouse-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (Iceberg data files live here)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # MinIO bucket initializer — creates the 'warehouse' and 'flink' buckets
  # ---------------------------------------------------------------------------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/warehouse;
        mc mb --ignore-existing local/flink;
        echo 'Buckets created.';
      "
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Project Nessie — Git-like catalog for Iceberg tables
  # ---------------------------------------------------------------------------
  nessie:
    image: projectnessie/nessie:latest
    container_name: lakehouse-nessie
    ports:
      - "19120:19120"
    environment:
      # In-memory store for local dev (data lost on restart — swap for RocksDB for persistence)
      QUARKUS_PROFILE: prod
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Flink JobManager
  # ---------------------------------------------------------------------------
  jobmanager:
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    image: lakehouse-flink:1.20.0
    container_name: lakehouse-jobmanager
    ports:
      - "8081:8081"   # Flink Web UI
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        rest.port: 8081
        # S3 / MinIO config (used by Flink checkpoints + Iceberg writes)
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    command: jobmanager
    volumes:
      - ./jobs:/opt/flink/jobs          # PyFlink job scripts
      - ./catalog:/opt/flink/catalog    # Catalog config & schema
    depends_on:
      minio-init:
        condition: service_completed_successfully
      nessie:
        condition: service_healthy
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ---------------------------------------------------------------------------
  # Flink TaskManager
  # ---------------------------------------------------------------------------
  taskmanager:
    image: lakehouse-flink:1.20.0
    container_name: lakehouse-taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    command: taskmanager
    volumes:
      - ./jobs:/opt/flink/jobs
      - ./catalog:/opt/flink/catalog
    depends_on:
      jobmanager:
        condition: service_healthy
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Message Generator (msgGeneratorKafka) — REST API to push events to Kafka
  # Mounts the sibling project directory so you don't need to copy code
  # ---------------------------------------------------------------------------
  msg-generator:
    image: python:3.11-slim
    container_name: lakehouse-msg-generator
    working_dir: /app
    ports:
      - "8090:8090"   # aiohttp REST API
    volumes:
      - ../msgGeneratorKafka:/app   # mount the sibling project
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "pip install --quiet -r requirements.txt && python src/main.py"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lakehouse

# ---------------------------------------------------------------------------
# Networks & Volumes
# ---------------------------------------------------------------------------
networks:
  lakehouse:
    driver: bridge

volumes:
  kafka-data:
  minio-data:
